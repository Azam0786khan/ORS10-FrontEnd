<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="reportForm">

            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Add Report' | translate }}
            </h2>

            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold" style="text-align: center;">
              {{ 'Update Report' | translate }}
            </h2>

            <!-- Error message -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Success message -->
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Report Name -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Report Name' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-file-alt grey-text"></i>
                  </div>
                </div>

                <input type="text" name="reportName"
                       [(ngModel)]="form.data.reportName"
                       class="form-control"
                       maxlength="50"
                       placeholder="{{ 'Enter Report Name' | translate }}">
              </div>

              <span *ngIf="form.inputerror.reportName" class="alertRedColor">
                {{ form.inputerror.reportName }}
              </span>
            </div>

            <!-- Generated By -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Generated By' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-user grey-text"></i>
                  </div>
                </div>

                <input type="text" name="generatedBy"
                       [(ngModel)]="form.data.generatedBy"
                       class="form-control"
                       placeholder="{{ 'Enter Generated By' | translate }}">
              </div>

              <span *ngIf="form.inputerror.generatedBy" class="alertRedColor">
                {{ form.inputerror.generatedBy }}
              </span>
            </div>

            <!-- Report Status -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Report Status' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-toggle-on grey-text"></i>
                  </div>
                </div>

                <select class="form-control"
                        name="reportStatus"
                        [(ngModel)]="form.data.reportStatus"
                        aria-label="ngSelected">
                  <option [ngValue]="undefined">
                    {{ 'Select Status' | translate }}
                  </option>
                  <option *ngFor="let s of form.preload.reportStatusList | keyvalue"
                          [value]="s.value">
                    {{ s.value }}
                  </option>
                </select>
              </div>

              <span *ngIf="form.inputerror.reportStatus" class="alertRedColor">
                {{ form.inputerror.reportStatus }}
              </span>
            </div>

            <!-- Buttons -->
            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0"
                        (click)="submit()"
                        class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0"
                        (click)="submit()"
                        class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1"
                   type="button"
                   [routerLink]="['/reportlist']"
                   style="text-decoration: none; color: white;">
                  {{ 'List' | translate }}
                </a>
              </div>

            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
