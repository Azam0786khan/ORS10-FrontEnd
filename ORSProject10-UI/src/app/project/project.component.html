<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="projectForm">

            <!-- TITLE -->
            <h2 *ngIf="!form.data.id"
                class="text-primary font-weight-bold"
                style="text-align: center;">
              {{ 'Add Project' | translate }}
            </h2>

            <h2 *ngIf="form.data.id"
                class="text-primary font-weight-bold"
                style="text-align: center;">
              {{ 'Update Project' | translate }}
            </h2>

            <!-- ERROR MESSAGE -->
            <div *ngIf="form.error && form.message"
                 class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- SUCCESS MESSAGE -->
            <div *ngIf="!form.error && form.message"
                 class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Project Name -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Project Name' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-folder-open grey-text"></i>
                  </div>
                </div>

                <input type="text"
                       name="projectName"
                       [(ngModel)]="form.data.projectName"
                       class="form-control"
                       maxlength="50"
                       placeholder="{{ 'Enter Project Name' | translate }}">
              </div>

              <span *ngIf="form.inputerror.projectName"
                    class="alertRedColor">
                {{ form.inputerror.projectName }}
              </span>
            </div>

            <!-- Project Category -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Project Category' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-list grey-text"></i>
                  </div>
                </div>

                <select class="form-control"
                        name="projectCategory"
                        [(ngModel)]="form.data.projectCategory">
                  <option [ngValue]="undefined">
                    {{ 'Select Category' | translate }}
                  </option>
                  <option *ngFor="let c of form.preload.projectCategoryList | keyvalue"
                          [value]="c.value">
                    {{ c.value }}
                  </option>
                </select>
              </div>

              <span *ngIf="form.inputerror.projectCategory"
                    class="alertRedColor">
                {{ form.inputerror.projectCategory }}
              </span>
            </div>

            <!-- Project Date -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Project Date' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-calendar grey-text"></i>
                  </div>
                </div>

                <input type="date"
                       name="projectDob"
                       [(ngModel)]="form.data.projectDob"
                       class="form-control">
              </div>

              <span *ngIf="form.inputerror.projectDob"
                    class="alertRedColor">
                {{ form.inputerror.projectDob }}
              </span>
            </div>

            <!-- Project Version -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Project Version' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-code-branch grey-text"></i>
                  </div>
                </div>

                <input type="text"
                       name="projectVersion"
                       [(ngModel)]="form.data.projectVersion"
                       class="form-control"
                       placeholder="{{ 'Enter Project Version' | translate }}">
              </div>

              <span *ngIf="form.inputerror.projectVersion"
                    class="alertRedColor">
                {{ form.inputerror.projectVersion }}
              </span>
            </div>

            <!-- BUTTONS -->
            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0"
                        (click)="submit()"
                        class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0"
                        (click)="submit()"
                        class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1"
                   type="button"
                   [routerLink]="['/projectlist']"
                   style="text-decoration: none; color: white;">
                  {{ 'List' | translate }}
                </a>
              </div>

            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
